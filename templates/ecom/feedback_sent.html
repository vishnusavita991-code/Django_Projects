{% extends 'ecom/homebase.html' %}
{% load static %}

{% block title %}Feedback Received | NEXUS Store{% endblock %}

{% block content %}
<div class="container-custom" style="padding-top: 60px; padding-bottom: 80px;">
  <div style="max-width: 520px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 48px; text-align: center; box-shadow: var(--shadow-sm);">
    <div style="width: 72px; height: 72px; border-radius: 50%; background: #ecfdf5; color: #10b981; display: flex; align-items: center; justify-content: center; font-size: 2.25rem; margin: 0 auto 20px auto;">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 8px;">Thank You!</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px;">
      Your feedback has been received and forwarded to our customer experience team. We appreciate your partnership!
    </p>
    <a href="/" class="btn-modern btn-primary-gradient" style="padding: 12px 28px;">
      Return to Store
    </a>
  </div>
</div>
{% endblock content %}
